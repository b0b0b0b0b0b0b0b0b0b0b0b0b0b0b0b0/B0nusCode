# ========================================
#          СООБЩЕНИЯ ПЛАГИНА
# ========================================
# Этот файл содержит все текстовые сообщения плагина
# Вы можете изменить любой текст на свой вкус
# Используйте цветовые коды для красивого оформления

# ========================================
#           ОСНОВНЫЕ СООБЩЕНИЯ
# ========================================
messages:
  # Сообщение, когда команду пытается выполнить консоль (не игрок)
  no-console: "&cТолько игроки могут использовать эту команду!"

  # Сообщение об отсутствии прав доступа
  no-permission: "&cУ вас нет прав для использования этой команды!"

  # Подсказка по использованию команды /promo
  usage: "&cИспользование: /promo <код>"

  # Сообщение о неверном промокоде
  invalid-promo: "&cНеверный промокод!"

  # Сообщение, если игрок уже использовал этот промокод
  already-used: "&cВы уже использовали этот промокод!"

  # Сообщение, если игрок уже использовал ЛЮБОЙ промокод
  already-used-any: "&cВы уже использовали промокод! Каждый игрок может использовать только один промокод."

  # Сообщение, если промокод исчерпал максимальное количество использований
  max-uses-reached: "&cЭтот промокод исчерпал максимальное количество использований!"

  # Сообщение, если у промокода нет наград
  no-rewards: "&cУ этого промокода нет наград!"

  # ========================================
  #      КРАСИВОЕ СООБЩЕНИЕ ОБ АКТИВАЦИИ
  # ========================================
  # Это сообщение показывается игроку при успешной активации промокода
  # %player% - имя игрока, %youtuber% - имя ютубера
  promo-activated: |
    &#6A0DAD&l    *✧･ﾟ &#C4B0FBПромокод активирован! &#6A0DAD&lﾟ･✧*
    &#6A0DAD  &#AB47BC%player% &#6A0DADиспользовал промокод от &#B388EB%youtuber%&#6A0DAD!
    &#6A0DAD               
    &#C4B0FB         Полученные награды:
    &#7E57C2       • Kit Titan
    &#7E57C2       • 100,000$
    &#7E57C2       • 2x Donate Case
    &#6A0DAD&l   ･✧ﾟ======================= ﾟ✧･

  # ========================================
  #         BROADCAST СООБЩЕНИЕ
  # ========================================
  # Это сообщение показывается ВСЕМ игрокам на сервере при активации промокода
  promo-broadcast:
    # Включить/выключить broadcast сообщения (true = включить, false = выключить)
    enabled: true
    # Текст сообщения для всех игроков
    # %player% - имя игрока, %youtuber% - имя ютубера
    message: |
      &#6A0DAD&l━━━━━━━━━━━━━━━━━━━━━━━━━━━
      &#C4B0FB  Игрок &#AB47BC%player% &#C4B0FBбыл приглашен
      &#C4B0FB  ютубером &#B388EB%youtuber%&#C4B0FB!
      &#6A0DAD&l━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # ========================================
  #        СООБЩЕНИЕ О НАГРАДЕ ЗА ВРЕМЯ
  # ========================================
  # Сообщение, которое показывается игроку при получении награды за время игры
  # %minutes% - количество минут игры, %rewards% - список полученных наград
  time-bonus-received: |
    &#ffd700&l✦ Бонус за время игры! ✦
    &#00ff00Вы играете уже %minutes% минут после активации промокода!
    &#ffd700Получено: %rewards%
  
  # ========================================
  #        СТАТИСТИКА ПРОМОКОДОВ
  # ========================================
  # Сообщения для админов при использовании команды /adminpromo stats
  
  # Заголовок статистики
  stats-header: "&#6A0DAD&l=== Статистика промокодов ==="
  
  # Строка с информацией о промокоде
  # %code% - код промокода, %youtuber% - имя ютубера, %uses% - количество использований
  stats-line: "&#C4B0FB%code% &#7E57C2(Ютубер: &#AB47BC%youtuber%&#7E57C2) - &#9575CD%uses% использований"
  
  # Дополнительная информация о максимальных использованиях (если есть лимит)
  # %max% - максимальное количество использований
  stats-max-uses: " &#7E57C2(макс: &#AB47BC%max%&#7E57C2)"
  
  # Подвал статистики
  stats-footer: "&#6A0DAD&l==========================="

# ========================================
#           ЦВЕТОВЫЕ КОДЫ
# ========================================
# Используйте эти коды для окрашивания текста:
# &0 = черный      &8 = темно-серый    &f = белый
# &1 = темно-синий &9 = синий          &a = зеленый
# &2 = темно-зеленый &b = голубой      &c = красный
# &3 = темно-голубой &d = фиолетовый   &e = желтый
# &4 = темно-красный &f = белый        &r = сброс цвета
# &5 = фиолетовый   &l = жирный        &o = курсив
# &6 = золотой      &n = подчеркнутый  &m = зачеркнутый
# &7 = серый        &k = зачеркнутый   &x = радужный
#
# Hex цвета (современные цвета):
# &#ff0000 = красный    &#00ff00 = зеленый    &#0000ff = синий
# &#ffff00 = желтый     &#ff00ff = фиолетовый &#00ffff = голубой
# &#ffffff = белый      &#000000 = черный     &#ffa500 = оранжевый